<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年级语文学习系统 v6.0 - Notion云端版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #2e7d32;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .hidden {
            display: none;
        }
        .user-info {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info strong {
            color: #667eea;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            width: auto;
            padding: 10px 20px;
        }
        .cloud-badge {
            background: #4CAF50;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: white;
            border: 2px solid #e0e0e0;
            color: #666;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录/注册页面 -->
        <div id="auth-view" class="card">
            <h1>三年级语文学习系统 v6.0 <span class="cloud-badge">云端版</span></h1>
            <p class="subtitle">Notion云端数据库 - 跨设备同步学习进度</p>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchAuthTab('login')">登录</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">注册</button>
            </div>

            <div id="error-container"></div>
            <div id="success-container"></div>

            <!-- 登录表单 -->
            <form id="login-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" required placeholder="请输入密码">
                </div>
                <button type="submit">登录</button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" required placeholder="3-20个字符,仅支持字母数字下划线">
                </div>
                <div class="form-group">
                    <label>显示名称</label>
                    <input type="text" id="register-displayname" required placeholder="请输入显示名称">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="register-password" required placeholder="至少6个字符">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="register-confirm-password" required placeholder="再次输入密码">
                </div>
                <button type="submit">注册</button>
            </form>
        </div>

        <!-- 应用主页面 (将在app.js中动态加载) -->
        <div id="app-container" class="hidden"></div>
    </div>

    <!-- API配置 -->
    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
    </script>

    <!-- 认证脚本 -->
    <script src="js/auth.js"></script>

    <!-- 应用主脚本 -->
    <script src="js/app.js"></script>
</body>
</html>
